name: S3 Integration Tests

on:
  push:
    branches: [main, s3_and_improvements]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  s3-tests:
    name: S3 integration tests with MinIO
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data

          # Wait for MinIO
          for i in {1..30}; do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is ready"
              break
            fi
            sleep 1
          done

      - name: Setup bucket
        run: |
          curl -sL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc alias set local http://localhost:9000 minioadmin minioadmin
          mc mb local/test-bucket

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libproj-dev libsqlite3-dev libgdal-dev libclang-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-s3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-s3-
            ${{ runner.os }}-cargo-

      - name: Generate and upload test file
        run: |
          cargo build --bin generate_test_cog --release
          ./target/release/generate_test_cog /tmp/test.tif --size 512 --pattern position
          mc cp /tmp/test.tif local/test-bucket/viridis/test.tif
          mc ls local/test-bucket/viridis/

      - name: Run S3 integration tests
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_ENDPOINT_URL: http://localhost:9000
          AWS_ALLOW_HTTP: "true"
          AWS_REGION: us-east-1
          S3_TEST_BUCKET: test-bucket
          S3_TEST_KEY: viridis/test.tif
        run: cargo test --features s3-tests s3 -- --nocapture

      - name: Cleanup
        if: always()
        run: docker rm -f minio || true
