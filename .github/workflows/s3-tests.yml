name: S3 Integration Tests

on:
  push:
    branches: [main, s3_and_improvements]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  s3-tests:
    name: S3 integration tests with MinIO
    runs-on: ubuntu-latest

    services:
      minio:
        image: quay.io/minio/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --entrypoint ""
        # Run minio server
        # Note: GitHub Actions requires command to be specified separately

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start MinIO server (workaround for service command)
        run: |
          # The service container is running but we need to ensure it's serving
          # Wait for the health check to pass
          for i in {1..30}; do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is healthy"
              break
            fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 1
          done

      - name: Install MinIO client
        run: |
          curl -sLo mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/

      - name: Setup test bucket with test data
        run: |
          # Configure mc
          mc alias set local http://localhost:9000 minioadmin minioadmin

          # Create test bucket
          mc mb local/test-bucket

          # Create test GeoTIFF structure: bucket/style/layer.tif
          # Use the small gray_3857.tif if available, otherwise create minimal test file
          if [ -f "data/test/gray_3857.tif" ]; then
            mc cp data/test/gray_3857.tif local/test-bucket/viridis/gray_3857.tif
            echo "Uploaded gray_3857.tif"
          else
            # Create minimal valid GeoTIFF for testing
            .github/scripts/create-test-tiff.sh /tmp/test.tif
            mc cp /tmp/test.tif local/test-bucket/viridis/test.tif
            echo "Uploaded minimal test.tif"
          fi

          # List bucket contents
          echo "Bucket contents:"
          mc ls --recursive local/test-bucket/

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libproj-dev \
            libsqlite3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-s3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-s3-
            ${{ runner.os }}-cargo-

      - name: Run S3 integration tests
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_ENDPOINT_URL: http://localhost:9000
          AWS_ALLOW_HTTP: "true"
          AWS_REGION: us-east-1
          S3_TEST_BUCKET: test-bucket
          S3_TEST_KEY: viridis/gray_3857.tif
        run: |
          cargo test --features s3-tests s3 -- --nocapture

      - name: Run S3TileReader tests
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_ENDPOINT_URL: http://localhost:9000
          AWS_ALLOW_HTTP: "true"
          AWS_REGION: us-east-1
          S3_TEST_BUCKET: test-bucket
        run: |
          cargo test --features s3-tests s3_tile_reader -- --nocapture
