[package]
name = "tileyolo"
version = "0.2.3"
edition = "2024"
description = "A simple raster-based XYZ tile server for serving GeoTIFFs"
license = "MIT"
repository = "https://github.com/evanjt/tileyolo"
readme = "README.md"
keywords = ["raster", "tiles", "gdal", "geotiff", "server"]
categories = ["science::geo", "web-programming::http-server"]

[lib]
name = "tileyolo"
path = "src/lib.rs"

[[bin]]
name = "tileyolo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
axum = { version = "0.8.3", features = ["macros"] }
cog3pio = { path = "../cog/cog3pio" }
geo = "0.29.0"
image = "0.25.6"
tokio = { version = "1.44.2", features = ["full"] }
walkdir = "2.5.0"
indicatif = "0.17"
comfy-table = { version = "7.1.4", features = [ "tty", "custom_styling"] }
once_cell = "1.19.0"
ndarray = "0.16.1"
colorgrad = "0.7.1"
weezl = "0.1.10"
lzw = "0.10.0"
salzweg = "0.1.4"
clap = { version = "4.5.37", features = ["derive"] }
tower-http = { version = "0.6.1", features = ["fs"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
csv = "1.3.1"
bytes = "1.5.0"
url = "2.5.7"
object_store = { version = "0.12.3", features = ["http"] }
proj = "0.30.0"
tiny_tiff = "0.5.2"
tiff = { version = "0.10.3", features = ["lzw", "deflate"], default-features = false }

[dev-dependencies]
rand = "0.9.1"
tempfile = "3.19.1"
tower = "0.5.2"
